<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SolRise form definitions</title>
  </head>
  <body>
    <form name="student-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="student-inquiry">
      <input type="text" name="bot-field">
      <input type="text" name="parent-name">
      <input type="email" name="email">
      <input type="tel" name="phone" required>
      <select name="contact-preference"><option>Email</option></select>
      <input type="text" name="student-name">
      <select name="grade"><option>Kindergarten</option></select>
      <select name="service"><option>Math K–12</option><option>Test Prep</option></select>
      <input type="radio" name="format" value="In person">
      <textarea name="goals"></textarea>
    </form>
  </body>
</html>
